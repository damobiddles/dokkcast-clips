<!-- the studio's look (brand.json "studio"), shared by the review page and the posting kit -->
<style>
  :root { --field: #0d1233; --button: #222a5c; --on-hi: #0A0F2C; --bw: 1px; --shadow: none; --radius: 10px; --scheme: dark; --head: inherit; }
  .post, .pl.box { border-width: var(--bw); border-radius: var(--radius); box-shadow: var(--shadow); }
  textarea, input[type=text], input[type=datetime-local] { background: var(--field); border-width: var(--bw); color-scheme: var(--scheme); }
  button, a.btn { background: var(--button); border-width: var(--bw); }
  button.primary { background: var(--hi); color: var(--on-hi); border: var(--bw) solid var(--line); box-shadow: var(--shadow); }
  header, footer { border-width: var(--bw); }
  h1 { font-family: var(--head); }
  .studio { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; color: var(--dim); font-size: 13px; text-decoration: none; }
  .studio img { height: 36px; width: auto; }
  .studio b { color: var(--text); font-family: var(--head); font-size: 15px; }
</style>
<script>
(() => {
  const S = /*STUDIO*/null;
  if (!S) return;
  const c = S.colors || {}, look = S.look || {}, r = document.documentElement.style;
  for (const [k, v] of Object.entries({ bg: c.bg, panel: c.panel, line: c.line, text: c.text, dim: c.dim, hi: c.accent, "on-hi": c.on_accent,
      field: c.field, button: c.button, ok: c.ok, warn: c.warn, bw: look.border, shadow: look.shadow, radius: look.radius,
      scheme: look.scheme, head: S.headline_font }))
    if (v) r.setProperty("--" + k, v);
  if (S.fonts_css) { const f = document.createElement("link"); f.rel = "stylesheet"; f.href = S.fonts_css; document.head.appendChild(f); }
  if (S.font) document.body.style.fontFamily = S.font;
  const page = document.body.dataset.page;
  document.title = S.name + (page ? " · " + page : "");
  // the studio's name and logo above the page title; back to the app when the page is opened through it
  const bar = document.createElement(location.protocol.startsWith("http") ? "a" : "div");
  bar.className = "studio";
  if (bar.tagName === "A") bar.href = "/";
  bar.innerHTML = (S.logo_data ? `<img alt="" src="${S.logo_data}">` : "") + `<b></b><span></span>`;
  bar.querySelector("b").textContent = S.name;
  bar.querySelector("span").textContent = S.tagline || "";
  const h = document.querySelector("header .wrap");
  if (h) h.prepend(bar);
})();
</script>
