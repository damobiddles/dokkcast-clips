<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A2B30"/>
      <stop offset="0.55" stop-color="#141518"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <radialGradient id="smoke" cx="0.2" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#8C8E96" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8C8E96" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smoke2" cx="0.95" cy="1" r="0.6">
      <stop offset="0" stop-color="#6E7078" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6E7078" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F4EF"/>
      <stop offset="1" stop-color="#DCD9D2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#F08A3C"/>
    </linearGradient>
    <mask id="holes">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <!-- sprocket holes -->
        <g id="row">
          <rect x="232" y="392" width="30" height="30" rx="7"/>
          <rect x="286" y="392" width="30" height="30" rx="7"/>
          <rect x="340" y="392" width="30" height="30" rx="7"/>
          <rect x="394" y="392" width="30" height="30" rx="7"/>
          <rect x="448" y="392" width="30" height="30" rx="7"/>
          <rect x="502" y="392" width="30" height="30" rx="7"/>
          <rect x="556" y="392" width="30" height="30" rx="7"/>
          <rect x="610" y="392" width="30" height="30" rx="7"/>
          <rect x="664" y="392" width="30" height="30" rx="7"/>
          <rect x="718" y="392" width="30" height="30" rx="7"/>
        </g>
        <use href="#row" y="210"/>
        <!-- picture frames -->
        <rect x="228" y="448" width="160" height="128" rx="12"/>
        <rect x="406" y="448" width="160" height="128" rx="12"/>
        <rect x="584" y="448" width="160" height="128" rx="12"/>
      </g>
    </mask>
    <clipPath id="keep"><polygon points="150,300 566,300 584,724 150,724"/></clipPath>
    <clipPath id="cut"><polygon points="566,300 900,300 900,724 584,724"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- macOS icon body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#smoke)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#smoke2)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <!-- the film strip, and the offcut snipped from its end -->
  <g filter="url(#shadow)" transform="translate(-30 4)">
    <g clip-path="url(#keep)" transform="translate(-14 10) rotate(-4 512 512)">
      <rect x="218" y="372" width="548" height="280" rx="30" fill="url(#film)" mask="url(#holes)"/>
    </g>
    <g transform="translate(62 -46) rotate(12 670 512)">
      <g clip-path="url(#cut)">
        <rect x="218" y="372" width="548" height="280" rx="30" fill="url(#amber)" mask="url(#holes)"/>
      </g>
    </g>
  </g>
</svg>
